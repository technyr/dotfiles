[bar/main]
width = 100%
height = 18
background = #cc000000
foreground = #d0d0d0
font-0 = JetBrainsMono Nerd Font:size=9;2
modules-left = i3
modules-center = date
modules-right = pulseaudio cpu memory
module-margin = 1
padding-right = 1

[module/i3]
type = internal/i3
label-focused = %index%
label-focused-background = #a0b070
label-focused-foreground = #000000
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%

[module/pulseaudio]
type = internal/pulseaudio
label-volume =  %percentage%%
label-muted =  muted

[module/cpu]
type = internal/cpu
interval = 2
label =  %percentage%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = 󰍛 %used% / %total%
warn-percentage = 90
format-warn = <label-warn>
label-warn = 󰍛 %used% / %total% !
label-warn-foreground = #ff5555

[module/date]
type = internal/date
interval = 1
date = %a %d %b %Y
time = %H:%M:%S
label =  %date%  %time%
